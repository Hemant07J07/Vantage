# Render Blueprint — provisions the web-facing half of the deployment in one
# pass ("New -> Blueprint" against this repo): the Django backend, ai-service
# and SearXNG as web services.
#
# No databases are provisioned here. Postgres runs on Supabase and Redis runs
# on Upstash, both external to Render — chosen specifically because Render's
# own free Postgres expires 30 days after creation, and Render's own free Key
# Value is capped at 25MB and wiped on every restart. Every POSTGRES_*/
# REDIS_URL value below is `sync: false`: paste it in from your Supabase
# project's connection info and Upstash's dashboard after the blueprint
# deploys, never commit it here.
#
# No top-level `envVarGroups` — Render's Blueprint schema doesn't allow
# `fromService` or `sync: false` entries inside one, only plain `value:`
# pairs, so a shared group can't hold most of what these services actually
# need. Only vantage-backend needs Supabase/Upstash anyway (ai-service needs
# Groq/SearXNG instead), so each service just lists its own vars directly.
#
# The Celery worker layer (qualify-worker, research-worker, monitor-worker,
# trends-worker, beat) is NOT here either — it runs on Railway, connecting
# back to this same Supabase/Upstash pair. See README.md "Deploying" for why
# (Render has no free tier at all for background workers; Railway's fits five
# small always-on services) and the Railway-specific setup steps.
#
# `sync: false` on a secret means: set it in the Render dashboard after the
# blueprint deploys, never commit it here.

services:
  - type: web
    name: vantage-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      # Supabase connection info — from your project's Database settings page
      # (use the pooler host/port, not the direct connection, the same way
      # backend/.env does locally).
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      # Upstash's rediss:// connection string, from its dashboard. TLS is
      # required — Celery won't start against it without CELERY_BROKER_USE_SSL,
      # which backend/config/settings.py already sets automatically whenever
      # REDIS_URL starts with rediss://.
      - key: REDIS_URL
        sync: false
      - key: AI_SERVICE_URL
        fromService: { type: web, name: vantage-ai-service, property: hostport }
      - key: AI_SERVICE_TIMEOUT_SECONDS
        value: "100"
      - key: AI_RESEARCH_TIMEOUT_SECONDS
        value: "200"
      - key: HIGH_INTENT_THRESHOLD
        value: "75"
      - key: RESEARCH_CACHE_TTL_HOURS
        value: "168"
      # Off by default even here, same reasoning as local dev: both make
      # outbound requests on a schedule, which should be a deliberate choice.
      # Flip to "true" once the Railway-hosted workers (see README) are
      # confirmed healthy and actually connected to Supabase/Upstash.
      - key: MONITOR_ENABLED
        value: "false"
      - key: MONITOR_BASE_INTERVAL_HOURS
        value: "24"
      - key: MONITOR_MAX_INTERVAL_HOURS
        value: "168"
      - key: MONITOR_MAX_BATCH
        value: "25"
      - key: MONITOR_TIMEOUT_SECONDS
        value: "120"
      - key: TREND_SCAN_ENABLED
        value: "false"
      - key: TREND_SCAN_INTERVAL_HOURS
        value: "24"
      - key: TREND_SCAN_DISPATCH_MINUTES
        value: "60"
      - key: TREND_SCAN_MAX_BATCH
        value: "5"
      - key: TREND_SCAN_SIGNAL_DEDUPE_DAYS
        value: "45"
      - key: RUN_MIGRATIONS
        value: "true"  # The only service that migrates. The Railway-hosted workers don't — on a brand-new deploy, bring this service up first so the schema exists before they start querying it.
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false  # vantage-backend.onrender.com, filled in after the first deploy assigns the domain.
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # your Vercel domain.

  - type: web
    name: vantage-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: SEARXNG_URL
        fromService: { type: web, name: vantage-searxng, property: hostport }
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # your Render backend's own URL + Vercel domain.
      - key: OLLAMA_API_KEY
        value: ""  # Unrelated to GROQ_*: only the optional hosted-search provider in web_search.py.

  - type: web
    name: vantage-searxng
    runtime: docker
    dockerfilePath: ./searxng/Dockerfile
    dockerContext: ./searxng
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BASE_URL
        sync: false  # https://vantage-searxng.onrender.com/, filled in after the first deploy assigns the domain.
      - key: INSTANCE_NAME
        value: vantage
