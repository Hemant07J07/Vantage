# Render Blueprint — provisions the ENTIRE deployment in one pass
# ("New -> Blueprint" against this repo) instead of configuring nine services
# by hand through the dashboard: the web services, the Celery worker layer,
# and the databases.
#
# Everything runs on Render, including the Celery workers — there's no
# separate VM to provision elsewhere. Render has no free tier for background
# workers (paid only, from $7/mo each); this blueprint keeps all five worker
# processes separate (qualify-worker, research-worker, monitor-worker,
# trends-worker, beat) rather than consolidating them onto fewer instances,
# so every concurrency-isolation decision made in this codebase — the
# qualify/research split, monitor's concurrency=4, trends' concurrency=1 —
# stays exactly as built. Expect roughly $35-40/mo for the five workers on
# Render's cheapest paid plan, on top of the (free-tier-eligible) web services
# and databases below.
#
# `sync: false` on a secret means: set it in the Render dashboard after the
# blueprint deploys, never commit it here.
#
# One real ordering wrinkle, not hidden: only `vantage-backend` runs
# migrations on startup (RUN_MIGRATIONS=true, reusing backend/entrypoint.sh's
# existing flag). The five workers below don't run migrations themselves, and
# Render deploys blueprint services independently — there's no built-in
# "wait for backend to finish migrating first" the way docker-compose's
# `depends_on: condition: service_completed_successfully` gives locally. On a
# brand-new deploy, a worker that starts before migrations finish will fail
# its first few tasks; Render restarts crashed worker processes
# automatically, so this self-heals once migrations complete, but it's worth
# knowing about rather than being surprised by on the very first deploy.

envVarGroups:
  - name: vantage-shared
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: POSTGRES_DB
        fromDatabase: { name: vantage-db, property: database }
      - key: POSTGRES_USER
        fromDatabase: { name: vantage-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: vantage-db, property: password }
      - key: POSTGRES_HOST
        fromDatabase: { name: vantage-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: vantage-db, property: port }
      - key: REDIS_URL
        fromService: { type: redis, name: vantage-redis, property: connectionString }
      - key: AI_SERVICE_URL
        fromService: { type: web, name: vantage-ai-service, property: hostport }
      - key: AI_SERVICE_TIMEOUT_SECONDS
        value: "100"
      - key: AI_RESEARCH_TIMEOUT_SECONDS
        value: "200"
      - key: HIGH_INTENT_THRESHOLD
        value: "75"
      - key: RESEARCH_CACHE_TTL_HOURS
        value: "168"
      # Off by default even here, same reasoning as local dev: both make
      # outbound requests on a schedule, which should be a deliberate choice.
      # Flip to "true" once the backend + all five workers are confirmed
      # healthy on a first deploy.
      - key: MONITOR_ENABLED
        value: "false"
      - key: MONITOR_BASE_INTERVAL_HOURS
        value: "24"
      - key: MONITOR_MAX_INTERVAL_HOURS
        value: "168"
      - key: MONITOR_MAX_BATCH
        value: "25"
      - key: MONITOR_TIMEOUT_SECONDS
        value: "120"
      - key: TREND_SCAN_ENABLED
        value: "false"
      - key: TREND_SCAN_INTERVAL_HOURS
        value: "24"
      - key: TREND_SCAN_DISPATCH_MINUTES
        value: "60"
      - key: TREND_SCAN_MAX_BATCH
        value: "5"
      - key: TREND_SCAN_SIGNAL_DEDUPE_DAYS
        value: "45"

databases:
  - name: vantage-db
    plan: free
    databaseName: vantage
    user: vantage

services:
  - type: redis
    name: vantage-redis
    plan: free
    ipAllowList: []  # Render-internal only — every consumer of this (backend + all five workers) is itself a Render service on the same private network.

  - type: web
    name: vantage-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    plan: free
    healthCheckPath: /api/
    envVarGroups:
      - vantage-shared
    envVars:
      - key: RUN_MIGRATIONS
        value: "true"  # The only service that migrates — see the ordering note above.
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false  # vantage-backend.onrender.com, filled in after the first deploy assigns the domain.
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # your Vercel domain.

  - type: worker
    name: vantage-qualify-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker -l info -Q qualify,celery --concurrency=1
    plan: starter
    envVarGroups:
      - vantage-shared
    envVars:
      - key: RUN_MIGRATIONS
        value: "false"

  - type: worker
    name: vantage-research-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker -l info -Q research --concurrency=1
    plan: starter
    envVarGroups:
      - vantage-shared
    envVars:
      - key: RUN_MIGRATIONS
        value: "false"

  - type: worker
    name: vantage-monitor-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker -l info -Q monitor --concurrency=4
    plan: starter
    envVarGroups:
      - vantage-shared
    envVars:
      - key: RUN_MIGRATIONS
        value: "false"

  - type: worker
    name: vantage-trends-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker -l info -Q trends --concurrency=1
    plan: starter
    envVarGroups:
      - vantage-shared
    envVars:
      - key: RUN_MIGRATIONS
        value: "false"

  - type: worker
    name: vantage-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config beat -l info
    plan: starter
    envVarGroups:
      - vantage-shared
    envVars:
      - key: RUN_MIGRATIONS
        value: "false"

  - type: web
    name: vantage-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: SEARXNG_URL
        fromService: { type: web, name: vantage-searxng, property: hostport }
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # your Render backend's own URL + Vercel domain.
      - key: OLLAMA_API_KEY
        value: ""  # Unrelated to GROQ_*: only the optional hosted-search provider in web_search.py.

  - type: web
    name: vantage-searxng
    runtime: docker
    dockerfilePath: ./searxng/Dockerfile
    dockerContext: ./searxng
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BASE_URL
        sync: false  # https://vantage-searxng.onrender.com/, filled in after the first deploy assigns the domain.
      - key: INSTANCE_NAME
        value: vantage
